# Install as /etc/systemd/system/nginx.service.d/moya-pilot-deadline.conf.
# Preserve the distribution's ExecStartPre checks; append this fail-closed guard.
# The approved root-owned /etc/moya-pilot/https.json must exist before any start.
[Service]
ExecStartPre=/usr/bin/python3 /usr/local/libexec/moya-pilot-certificate.py start-guard
