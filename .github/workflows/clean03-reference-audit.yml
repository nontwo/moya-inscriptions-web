name: CLEAN-03 Reference Audit

on:
  pull_request:
    branches:
      - integration/mvp

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request merge result
        uses: actions/checkout@v6

      - name: Collect retired data-access references
        shell: bash
        run: |
          set -o pipefail
          grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude=clean03-references.txt \
            '@moya/data-access|packages/data-access|retainedDataAccess|data-access-surface' \
            . \
            > clean03-references.txt || true
          cat clean03-references.txt

      - name: Upload reference report
        uses: actions/upload-artifact@v4
        with:
          name: clean03-reference-audit
          path: clean03-references.txt
          if-no-files-found: error
          retention-days: 1
