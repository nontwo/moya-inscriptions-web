name: Apply Repository Formatting

on:
  push:
    branches:
      - chore/ci-e2e-fast-path

permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out task branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: chore/ci-e2e-fast-path

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact repository formatting and remove helper workflow
        run: |
          set -euo pipefail
          pnpm format
          rm .github/workflows/format-preview.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Expected formatting changes were not produced." >&2
            exit 1
          fi

          git commit -m "style: apply repository formatting"
          git push origin HEAD:chore/ci-e2e-fast-path
