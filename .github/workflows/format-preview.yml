name: Apply Repository Formatting

on:
  push:
    branches:
      - chore/ci-e2e-fast-path

permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out task branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: chore/ci-e2e-fast-path

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format non-workflow files and publish workflow blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm format

          create_blob() {
            FILE_PATH="$1" node <<'NODE'
          const { readFileSync } = require("node:fs");

          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`,
            {
              method: "POST",
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
              body: JSON.stringify({
                content: readFileSync(process.env.FILE_PATH, "utf8"),
                encoding: "utf-8",
              }),
            },
          );
          if (!response.ok) {
            throw new Error(`Git blob creation failed: ${response.status}`);
          }
          const result = await response.json();
          process.stdout.write(result.sha);
          NODE
          }

          ci_blob="$(create_blob .github/workflows/ci.yml)"
          full_blob="$(create_blob .github/workflows/e2e-full.yml)"
          echo "FORMATTED_CI_BLOB=$ci_blob"
          echo "FORMATTED_FULL_BLOB=$full_blob"

          git restore --source=HEAD -- \
            .github/workflows/ci.yml \
            .github/workflows/e2e-full.yml \
            .github/workflows/format-preview.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/governance/history/2026-09-04-proportionate-browser-ci-audit.md \
            scripts/ci-e2e-scope.mjs \
            tests/e2e/README.md \
            tests/unit/architecture/ci-e2e-policy.test.ts

          if git diff --cached --quiet; then
            echo "Expected non-workflow formatting changes were not produced." >&2
            exit 1
          fi

          git commit -m "style: apply repository formatting"
          git push origin HEAD:chore/ci-e2e-fast-path
