<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
  <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.16 0.008" numOctaves="2" seed="17" stitchTiles="stitch" result="fiber"/>
    <feColorMatrix in="fiber" type="matrix" values=".34 0 0 0 .5  0 .34 0 0 .46  0 0 .3 0 .36  0 0 0 .78 0" result="fiberTone"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="3" seed="29" stitchTiles="stitch" result="mottle"/>
    <feColorMatrix in="mottle" type="matrix" values=".18 0 0 0 .4  0 .2 0 0 .37  0 0 .16 0 .29  0 0 0 .5 0" result="mottleTone"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.46" numOctaves="2" seed="43" stitchTiles="stitch" result="grain"/>
    <feBlend in="fiberTone" in2="mottleTone" mode="screen" result="paperField"/>
    <feBlend in="paperField" in2="grain" mode="soft-light"/>
  </filter>
  <rect width="384" height="512" fill="transparent" filter="url(#paper)" opacity="0.045"/>
</svg>
