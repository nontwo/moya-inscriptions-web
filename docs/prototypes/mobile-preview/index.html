<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>由艺交互预览</title>
    <script>
      try {
        const theme = localStorage.getItem("yoyi.theme-preference");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        const layout = localStorage.getItem("yoyi.home-feed-layout");
        document.documentElement.dataset.homeLayout =
          layout === "single" ? "single" : "double";
      } catch {
        document.documentElement.dataset.homeLayout = "double";
      }
    </script>
    <link
      rel="stylesheet"
      href="../../../packages/design-tokens/src/theme.css"
    />
    <link rel="stylesheet" href="../../../packages/ui/src/styles.css" />
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>

      <div class="mobile-app yoyi-paper yoyi-paper--visible" data-mobile-app>
        <section class="app-view" data-view="home" aria-label="首页">

                data-home-feed="discover"
                role="tab"
                aria-label="发现"

                type="button"

              <button

              </button>
              <button

              <button

              <button

            <div class="app-masonry" data-feed-panel="nearby" hidden>

              <button

              <button

              <button

                type="button"

            </label>

              data-open-settings

              type="button"
            >
              <span
                class="yoyi-icon"
                data-icon="settings"
                aria-hidden="true"
              ></span>
            </button>

                <div class="app-inscriptions-list-head__actions">

                      data-icon="filter"
                      aria-hidden="true"
                    ></span>

                  <button

                    type="button"
                    data-shell-control
                    aria-disabled="true"

                    排序

                      class="yoyi-icon yoyi-icon--sm"
                      data-icon="next"
                      aria-hidden="true"
                    ></span>
                  </button>
                </div>
              </div>
              <main class="app-scroll app-list" data-scroll-view="inscriptions">
                <button

                  <span
                    class="yoyi-icon yoyi-icon--sm"
                    data-icon="next"
                    aria-hidden="true"
                  ></span>
                </button>
                <button
                  class="app-list-item"
                  data-search-text="石门东侧残刻 东汉 隶书 汉中石门"

                  <span class="app-list-item__body">
                    <span class="app-list-item__title">龙门北壁造像记</span>

                </button>
                <button type="button" data-shell-control aria-disabled="true">
